# Equivariant_pathway training layouts — AUTO-GENERATED.
#
# This file is rewritten by Equivariant_pathway/run_full_cycle.py at
# setup time using the dmnpol-style random sampler:
#   - sample 20 unique solvable 5x5 layouts
#   - each layout has a randomly-drawn start_pos, goal_pos, and
#     fire_positions (3 fires)
#   - signatures are deduplicated AND excluded against
#     test_layouts.yaml + heldout_test_layouts.yaml so the training
#     distribution never overlaps the held-out evaluation set
#   - n_repetitions: 1 — one demo per layout (no repetitions)
#
# DO NOT HAND-EDIT. Re-generate via:
#   python -m Equivariant_pathway.run_full_cycle --regen_training ...
# or by passing --force_retrain (which also wipes demos/ and checkpoints/).
#
# When this file is empty (no `training_layouts:` key) or has fewer than
# --initial_demos entries, run_full_cycle.py samples a fresh batch.
img_size: 80
grid_size: 5
cell_px: 16
num_fires: 3
min_manhattan: 4
training_layouts: []
