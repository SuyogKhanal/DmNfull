# Default config for the hybrid baseline_vs_p4 budget comparison.
#
# Override on the command line:
#   python -m Equivariant_pathway.equivariant_CNN_hybrid.baseline_vs_p4.run_one \
#       --budget 15 --run_index 0 --target_sr 0.90
#
# ``budget`` is the per-run cap on EXTRA demonstrations on top of
# ``initial_demos`` (20). The same value is enforced for both methods.

initial_demos: 20
heldout_n: 200
correction_n: 40
initial_epochs: 500
round_epochs: 500
baseline_round_epochs: 100
max_steps: 60
target_sr: 0.90
budget: 15
max_rounds: 50
train_from_scratch: true
seed: 0
