# config_stack_smoke.yaml — fast GPU validation of the StackCube bring-up before
# the one-seed launch. Exercises the full path with the NEW code: the motion-
# planner expert (shared bootstrap + initial demos + mid-episode corrective demo),
# both arms to a tiny budget, the diffusion-loss p4_select detector, the LLM
# selector ON, and total_expert_calls + stopped_reason logging. Tiny knobs.
#
# PASS = bootstrap writes init_ckpt.pth; both arms write learning_curve.json with
# non-null total_expert_calls + a sane stopped_reason; p4_select logs
# "signal=diffusion" + "LLM selector ON"; no Traceback / proxy errors; the
# motion planner yields a non-empty demo (n_demos grows past initial_demos).

n_runs: 1
initial_demos: 5
budget: 3                  # 3 demos per arm → fast
demos_per_round: 1
target_sr: 1.0
max_rounds: 100
max_steps: 100
heldout_n: 6
seed: 1

nd_retrain: 1
initial_epochs: 40
round_epochs: 20
max_train_steps: 2000
eval_num_envs: 3           # heldout_n(6) % eval_num_envs(3) == 0
rollout_episodes: 6
max_episodes_per_arm: 60

methods: ["diff_dagger", "p4_select"]

environments: ["StackCube-v1"]

p4_select:
  n_cand: 2

baselines:
  diff_dagger: {alpha: 0.99, patience: 2, batch_multiplier: 8}
  safe_dagger: {tau: 0.1}
  dropout_dagger: {tau: 0.1, p: 0.9, N: 10, d: 0.1}
  ensemble_dagger: {M: 5, tau: 0.1, chi: 0.05}
  thrifty_dagger: {alpha_h: 0.1, gamma: 0.99, M: 5, q_epochs: 50}
  stagger: {}

p4:
  model: null
  vlm: null
  reasoning_llm: null
  config_llm: null
  high_loss_percentile: 95
  phase_b_workers: 8
  batch_multiplier: 8
