# config_astar_smoke.yaml — fast GPU validation of the FIXED A* harness before the
# 5-seed launch. Exercises the full path with the new code: ExpertCallCounter proxy
# (passed through the fork's shared bootstrap + demo collection), both arms to a tiny
# budget, total_expert_calls + stopped_reason logging, the max_episodes label, and
# the LLM selector ON for p4_select. Tiny knobs → ~15-25 min.
#
# PASS = both methods write learning_curve.json with non-null total_expert_calls and
# a sane stopped_reason, p4_select logs "LLM selector ON", no proxy/import errors.

n_runs: 1
initial_demos: 5
budget: 3                  # 3 demos per arm → fast
demos_per_round: 1
target_sr: 1.0
max_rounds: 100
max_steps: 200
heldout_n: 6
seed: 1

nd_retrain: 1
initial_epochs: 40
round_epochs: 20
max_train_steps: 2000
eval_num_envs: 4
rollout_episodes: 6
max_episodes_per_arm: 40

methods: ["diff_dagger", "p4_select"]

environments: ["StackCube-v1", "PickCube-v1", "PushT-v1", "PlugCharger-v1"]

p4_select:
  n_cand: 2

baselines:
  diff_dagger: {alpha: 0.99, patience: 1, batch_multiplier: 8}
  safe_dagger: {tau: 0.1}
  dropout_dagger: {tau: 0.1, p: 0.9, N: 10, d: 0.1}
  ensemble_dagger: {M: 5, tau: 0.1, chi: 0.05}
  thrifty_dagger: {alpha_h: 0.1, gamma: 0.99, M: 5, q_epochs: 50}
  stagger: {}

p4:
  model: null
  vlm: null
  reasoning_llm: null
  config_llm: null
  high_loss_percentile: 95
  phase_b_workers: 8
  batch_multiplier: 8
