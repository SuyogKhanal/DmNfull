# config_stack_p4top3_smoke.yaml — fast GPU validation of the SUITE-SIDE p4_top3 arm
# on StackCube (the full VLM→reason→prescribe-cube-layout→reposition→motion-planner-
# solve loop) before the 5-seed run. Tiny budgets; rendering ON (p4_top3 needs frames).
#
# PASS = bootstrap init_ckpt; both arms write learning_curve.json (variant p4_top3 for
# the p4 arm) with non-null total_expert_calls + sane stopped_reason; the p4_top3 log
# shows rendering (frames saved), a VLM report, a cube prescription, and a prescribed
# demo kept (n_demos grows); no Traceback / proxy / render errors.

n_runs: 1
initial_demos: 5
budget: 2                  # 2 corrective demos per arm → fast
demos_per_round: 1
target_sr: 1.0
max_rounds: 100
max_steps: 200
heldout_n: 6
seed: 1

nd_retrain: 1
initial_epochs: 40
round_epochs: 20
max_train_steps: 2000
eval_num_envs: 3           # heldout_n(6) % eval_num_envs(3) == 0
rollout_episodes: 6
max_episodes_per_arm: 60

methods: ["diff_dagger", "p4_top3"]

environments: ["StackCube-v1"]

p4_select:
  n_cand: 2                # also used as p4_top3 candidate count per round

baselines:
  diff_dagger: {alpha: 0.99, patience: 2, batch_multiplier: 5}
  safe_dagger: {tau: 0.1}
  dropout_dagger: {tau: 0.1, p: 0.9, N: 10, d: 0.1}
  ensemble_dagger: {M: 5, tau: 0.1, chi: 0.05}
  thrifty_dagger: {alpha_h: 0.1, gamma: 0.99, M: 5, q_epochs: 50}
  stagger: {}

p4:
  model: null
  vlm: null
  reasoning_llm: null
  config_llm: null
  high_loss_percentile: 95
  phase_b_workers: 8
  batch_multiplier: 8
  represcribe_attempts: 3
  infeasible_attempts: 3
