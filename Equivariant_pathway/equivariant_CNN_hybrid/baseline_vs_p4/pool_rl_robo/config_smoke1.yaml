# Smoke-1 config: short real run to verify the policy BACKBONES train + roll out
# on a regular GPU (no h100/h200), P4 OFF (the 5 IIL baselines only). Reduced
# budget/epochs/eval + lighter diffusion so it finishes fast but still shows the
# reward/success curve moving.

seed: 42
budget: 3
n_seed_demos: 5
initial_epochs: 150
round_epochs: 80
n_eval_episodes: 8
n_rollout_episodes: 1
max_steps: 1000
max_consecutive_empty: 8
hidden: 256
lr: 0.0003
batch_size: 256
weight_decay: 0.0001

methods: ["safe_dagger", "dropout_dagger", "ensemble_dagger", "thrifty_dagger", "stagger"]

diffusion:
  r3m_model: resnet18
  T: 50
  hidden: 512
  lr: 0.0001
  batch_size: 128
  weight_decay: 0.000001
  n_uncertainty_samples: 4

p4:
  kag_dir: null
  n_failure_rollouts: 3
  top_k_failures: 3

baselines:
  safe:     {tau: 0.5}
  dropout:  {N: 8, dropout_d: 0.1, tau: 0.5, p: 0.5}
  ensemble: {M: 3, tau: 0.5, sigma: 0.02}
  thrifty:  {M: 3, alpha_h: 0.10, gamma: 0.98, q_epochs: 30, q_lr: 0.001}
  stagger:  {}
