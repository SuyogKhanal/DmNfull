# Profile 2: VLM + Reasoning + Plain LLM (per-episode) + Plain LLM Aggregator
# Cross-episode reasoning is OFF — aggregator runs but skips the reasoning step.
pipeline:
  use_vlm: true
  use_reasoning: true
  use_cross_episode_reasoning: false
  use_kag: false
  use_rag: false
  use_tkf: false
  use_plain_llm: true
  use_aggregator: true
