# Profile 1: VLM + Plain LLM (per-episode) + Plain LLM Aggregator
# No reasoning, no KAG, no RAG, no TKF, no cross-episode reasoning.
pipeline:
  use_vlm: true
  use_reasoning: false
  use_cross_episode_reasoning: false
  use_kag: false
  use_rag: false
  use_tkf: false
  use_plain_llm: true
  use_aggregator: true
